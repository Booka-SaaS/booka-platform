name: CI - Booka Backend

on:
  push:
    branches: [dev, main, master]
    paths:
      - 'backend/**'
      - 'package.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [dev, main, master]
    paths:
      - 'backend/**'
      - 'package.json'
      - '.github/workflows/backend-ci.yml'

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booka_v2?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/booka_v2?schema=public
  JWT_SECRET: booka-v2-local-secret-change-me
  CLIENT_ORIGIN: http://localhost:4200
  GATEWAY_ORIGIN: http://localhost:3000
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  GOOGLE_CLIENT_ID: google-client-id-test.apps.googleusercontent.com

jobs:
  build-and-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm run backend:install

      - name: Generate Prisma Client
        run: npm run backend:prisma:generate

      - name: Build backend
        run: npm run backend:build

      - name: Run backend unit tests
        run: npm run backend:test

  integration:
    runs-on: ubuntu-latest
    needs: build-and-unit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booka_v2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booka_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm run backend:install

      - name: Generate Prisma Client
        run: npm run backend:prisma:generate

      - name: Deploy migrations
        run: npm run backend:prisma:deploy

      - name: Run backend integration tests
        run: npm --prefix backend run test:integration
