services:
  - type: web
    name: booka-api
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run prisma:resolve-failed && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_TTL_SECONDS
        value: 604800
      - key: CLIENT_ORIGIN
        sync: false
      - key: GATEWAY_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Booka <noreply@booka.app>
      - key: RABBITMQ_URL
        sync: false
      - key: GATEWAY_PORT
        value: 3000
      - key: CORE_API_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_PORT
        value: 3002
